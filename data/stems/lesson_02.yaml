lesson: 2
stems:
- stem: spir
  meaning: breathe
  example_word: respiratory
  example_definition: relating to the organs of respiration or breathing
- stem: ventr
  meaning: belly
  example_word: ventral
  example_definition: near the underside of an animal
- stem: myo
  meaning: muscle
  example_word: myoid
  example_definition: resembles muscles or is made up of muscle
- stem: ocul
  meaning: eye
  example_word: binoculars
  example_definition: an optical instrument to use with both eyes with two small telescopes
- stem: pneumo
  meaning: lung
  example_word: pneumonia
  example_definition: a serious illness when both lungs become red, swollen and filled
    with fluid
- stem: digit
  meaning: finger
  example_word: indigitate
  example_definition: an attachment added to an airplane enabling it to glide on the
    water; a seaplane
- stem: cad
  meaning: fall
  example_word: cadaver
  example_definition: chronic inflammation of the membrane outlining the bronchial
    tubes caused by respiratory infection
