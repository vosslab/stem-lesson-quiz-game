stems:
- stem: erythro
  meaning: red
  example_word: erythrocytes
  example_definition: a type of blood cell that is made in the bone marrow and found
    in the blood
- stem: hyper
  meaning: over
  example_word: hyperventilate
  example_definition: a rapid or deep breathing ; over breathing
- stem: hetero
  meaning: different
  example_word: heterogenous
  example_definition: compose of parts of different kinds; unlike
- stem: i
  meaning: plural
  example_word: cacti
  example_definition: the plural form of cactus
- stem: ess
  meaning: female
  example_word: actress
  example_definition: a woman or girl who is an actor
- stem: monger
  meaning: seller
  example_word: fishmonger
  example_definition: someone who sells raw fish and seafood
- stem: nano
  meaning: billionth
  example_word: nanosecond
  example_definition: one billionth of a second
