lesson: 8
stems:
- stem: man
  meaning: hand
  example_word: manicure
  example_definition: a treatment for the care of the hands and fingernails
- stem: ose
  meaning: sugar
  example_word: sucrose
  example_definition: a sweet crystalline sugar that occurs naturally in most plants
- stem: scope
  meaning: look
  example_word: telescope
  example_definition: tubular optical instrument for viewing distant objects by means
    of the refraction of light rays
- stem: vore
  meaning: eating
  example_word: herivore
  example_definition: an animal that eats mostly plants for energy
- stem: ecto
  meaning: outer
  example_word: ectoderm
  example_definition: the outermost layer of the 3 germ layers
- stem: bio
  meaning: life
  example_word: biosphere
  example_definition: the part of the earth that supports life including living organisms
- stem: an
  meaning: without
  example_word: anonymous
  example_definition: lacking a name or identity of unknown origin
