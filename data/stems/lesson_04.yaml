lesson: 4
stems:
- stem: zo
  meaning: animal
  example_word: zoology
  example_definition: the study of the behavior and classification of animals
- stem: opia
  meaning: sight
  example_word: diplopia
  example_definition: a condition where a person sees two images of a single object
- stem: dors
  meaning: back
  example_word: dorsal
  example_definition: situated near or on the back of an animal
- stem: corp
  meaning: body
  example_word: corpulent
  example_definition: having a large, bulky body
- stem: apt
  meaning: fit
  example_word: adapt
  example_definition: to make fit by modification
- stem: hippo
  meaning: horse
  example_word: hippogriff
  example_definition: a legendary animal that has the foreparts of a griffin and the
    body of a horse
- stem: leuko
  meaning: white
  example_word: leukocyte
  example_definition: colorless blood cells of the immune system
