lesson: 17
stems:
- stem: platy
  meaning: flat
  example_word: platypus
  example_definition: a small aquatic mammal with webbed feet, a bill like a duck,
    dense fur and flat feet found in lakes in Australia
- stem: ichthy
  meaning: fish
  example_word: ichthyology
  example_definition: a branch of zoology that deals with fish
- stem: homo
  meaning: same
  example_word: homophone
  example_definition: one of two or more words pronounced alike but different in meaning
- stem: nuc
  meaning: center
  example_word: nucleus
  example_definition: the positively charged central portion of an atom
- stem: pop
  meaning: people
  example_word: population
  example_definition: the total of people occupying an area or making up a whole
- stem: spor
  meaning: seed
  example_word: spore
  example_definition: a small, one-celled reproductive unit produced by plants, capable
    of development into a new individual either directly or after fusion with another
    spore
- stem: anim
  meaning: mind
  example_word: unanimous
  example_definition: everyone is in total agreement
