lesson: 16
stems:
- stem: tude
  meaning: state of
  example_word: solitude
  example_definition: the quality or state of being alone or remote from society
- stem: blasto
  meaning: embryo
  example_word: blastoderm
  example_definition: the layer of embryonic tissue that forms prior to the development
    of the embryonic axis.
- stem: amphi
  meaning: both
  example_word: amphibian
  example_definition: a cold blooded vertebrate animal that includes frogs, toads
    and salamanders
- stem: chlor
  meaning: green
  example_word: chloroplast
  example_definition: in green plant cells, a plastid that contains chlorophyll in
    which photosynthesis takes place
- stem: somn
  meaning: sleep
  example_word: somnolent
  example_definition: heavy with sleep; drowsy
- stem: muta
  meaning: change
  example_word: mutate
  example_definition: change or cause to change in form or nature.
- stem: ous
  meaning: full of
  example_word: zealous
  example_definition: showing great energy or enthusiasm
