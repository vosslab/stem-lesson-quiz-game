lesson: 6
stems:
- stem: dys
  meaning: bad
  example_word: dystopian
  example_definition: being an imagined world or society in which people lead dehumanized,
    fearful lives
- stem: emia
  meaning: blood
  example_word: anemia
  example_definition: a condition in which the blood is deficient in red blood cells,
    in hemoglobin, or in total volume
- stem: fic
  meaning: make
  example_word: difficult
  example_definition: hard to do or make
- stem: idio
  meaning: peculiar
  example_word: idiolect
  example_definition: language or speech pattern of one individual at a particular
    period of life
- stem: ab
  meaning: away
  example_word: absent
  example_definition: not present or existing
- stem: cephalo
  meaning: head
  example_word: cephalopod
  example_definition: a class of marine mollusks including the squids, and octopuses
    that move by expelling water from a tubular siphon under the head
- stem: derm
  meaning: skin
  example_word: taxidermy
  example_definition: the art of preparing, stuffing, and mounting the skins of animals
